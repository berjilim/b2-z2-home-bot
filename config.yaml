name: BZ-V2 Home Guardian
description: Always-on AI home guardian over Telegram — runs as a Home Assistant Supervisor add-on, powered by Claude.
slug: bz-v2
url: https://github.com/berjilim/b2-z2-home-bot
version: 0.1.30
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - share:rw
options:
  claude_oauth_token: ""
  telegram_bot_token: ""
  owner_chat_id: ""
  log_level: info
schema:
  claude_oauth_token: password
  telegram_bot_token: password
  owner_chat_id: str
  log_level: "list(debug|info|warn|error)?"

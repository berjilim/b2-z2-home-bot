name: BZ-V2 Home Guardian
description: Standalone always-on home guardian (Claude + ACP) over Telegram
slug: bz-v2
url: https://github.com/berjilim/b2-z2-home-bot
version: 0.1.21
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - share:rw
options:
  claude_oauth_token: ""
  telegram_bot_token: ""
  telegram_bernard_id: ""
  telegram_zane_id: ""
  log_level: info
schema:
  claude_oauth_token: password
  telegram_bot_token: password
  telegram_bernard_id: str
  telegram_zane_id: str?
  log_level: "list(debug|info|warn|error)?"
